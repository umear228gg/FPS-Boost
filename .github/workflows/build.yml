
name: UMEAR Mobile Boost Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE=$(find extracted -name build.gradle -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Compile UMEAR Mod
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UMEAR-Mobile-Boost-PvP
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          ret
          ention-days: 14
